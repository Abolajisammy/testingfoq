<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Loading Number</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding-top: 100px;
    font-size: 3rem;
  }

  .number {
    font-weight: bold;
    color: #333;
  }
</style>
</head>
<body>

<div class="number" id="number">0</div>

<script>
  const numberElement = document.getElementById('number');
  const finalNumber = 9876; // 👈 The final number to show
  const duration = 2000;    // 👈 Duration of the random animation in ms (2 seconds)
  const interval = 50;      // 👈 How fast numbers change during loading

  let elapsed = 0;

  const randomInterval = setInterval(() => {
    // Show random number while loading
    const randomNum = Math.floor(Math.random() * 10000);
    numberElement.textContent = randomNum;

    elapsed += interval;

    // After the duration, stop and show final number
    if (elapsed >= duration) {
      clearInterval(randomInterval);
      numberElement.textContent = finalNumber;
    }
  }, interval);
</script>

</body>
</html>
