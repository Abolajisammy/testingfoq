<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Carousel</title>
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background-color: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }

  .carousel-container {
    position: relative;
    width: 90%;
    max-width: 1200px;
    overflow: hidden;
  }

  .carousel-track {
    display: flex;
    overflow-x: auto;
    scroll-behavior: smooth;
    scrollbar-width: none; /* for Firefox */
  }

  .carousel-track::-webkit-scrollbar {
    display: none; /* for Chrome, Safari */
  }

  .audio-card {
    background: #fff;
    flex: 0 0 260px;
    margin: 0 10px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    text-align: center;
    padding: 20px;
    transition: transform 0.3s ease;
  }

  .audio-card:hover {
    transform: scale(1.05);
  }

  .audio-card i {
    font-size: 50px;
    color: #1f847d;
    margin-bottom: 10px;
  }

  .audio-card h2 {
    font-size: 18px;
    color: #333;
    margin-bottom: 15px;
  }

  audio {
    width: 100%;
    outline: none;
  }

  /* Navigation Buttons */
  .carousel-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background-color: #1f847d;
    color: #fff;
    border: none;
    font-size: 22px;
    cursor: pointer;
    padding: 10px 14px;
    border-radius: 50%;
    z-index: 10;
    transition: 0.3s;
  }

  .carousel-btn:hover {
    background-color: #16655f;
  }

  .prev {
    left: -25px;
  }

  .next {
    right: -25px;
  }

  @media (max-width: 768px) {
    .carousel-btn {
      display: none; /* Hide buttons on small screens (scroll with touch) */
    }
    .audio-card {
      flex: 0 0 80%;
    }
  }
</style>

<!-- Font Awesome for icons -->
<script src="https://kit.fontawesome.com/a2d04b6e4c.js" crossorigin="anonymous"></script>
</head>
<body>

<div class="carousel-container">
    <button class="carousel-btn prev">&#10094;</button>

    <div class="carousel-track" id="carousel">
      <div class="audio-card">
        <i class="fas fa-music"></i>
        <h2>Relaxing Spa Music</h2>
        <audio controls>
          <source src="audio1.mp3" type="audio/mpeg">
        </audio>
      </div>

      <div class="audio-card">
        <i class="fas fa-drum"></i>
        <h2>Meditation Beats</h2>
        <audio controls>
          <source src="audio2.mp3" type="audio/mpeg">
        </audio>
      </div>

      <div class="audio-card">
        <i class="fas fa-guitar"></i>
        <h2>Chill Guitar Vibes</h2>
        <audio controls>
          <source src="audio3.mp3" type="audio/mpeg">
        </audio>
      </div>

      <div class="audio-card">
        <i class="fas fa-cloud-moon"></i>
        <h2>Night Ambience</h2>
        <audio controls>
          <source src="audio4.mp3" type="audio/mpeg">
        </audio>
      </div>

      <div class="audio-card">
        <i class="fas fa-water"></i>
        <h2>Ocean Sounds</h2>
        <audio controls>
          <source src="audio5.mp3" type="audio/mpeg">
        </audio>
      </div>
    </div>

    <button class="carousel-btn next">&#10095;</button>
</div>

<script>
  const track = document.getElementById('carousel');
  const nextButton = document.querySelector('.next');
  const prevButton = document.querySelector('.prev');

  nextButton.addEventListener('click', () => {
    track.scrollBy({ left: 300, behavior: 'smooth' });
  });

  prevButton.addEventListener('click', () => {
    track.scrollBy({ left: -300, behavior: 'smooth' });
  });
</script>

</body>
</html>
